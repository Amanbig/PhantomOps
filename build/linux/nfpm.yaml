# Linux packages (.deb / .rpm). Built by .github/workflows/release.yml:
#   cd build/linux && VERSION=0.1.0 nfpm package --config nfpm.yaml --packager deb --target ../../phantomops-linux-amd64.deb
name: "phantomops"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "admin"
priority: "optional"
maintainer: "Amanbig <amanpreetsinghjhiwant@outlook.com>"
description: "PhantomOps - the ghost hunter for your infrastructure. Correlates Docker, Kubernetes, Nomad, Prometheus, Loki and SSH signals into incidents with root-cause analysis."
homepage: "https://github.com/Amanbig/PhantomOps"
license: "Apache-2.0"

contents:
  - src: ../bin/PhantomOps
    dst: /usr/bin/phantomops
    file_info:
      mode: 0755
  - src: phantomops.desktop
    dst: /usr/share/applications/phantomops.desktop
  - src: icons/16x16.png
    dst: /usr/share/icons/hicolor/16x16/apps/phantomops.png
  - src: icons/24x24.png
    dst: /usr/share/icons/hicolor/24x24/apps/phantomops.png
  - src: icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/phantomops.png
  - src: icons/48x48.png
    dst: /usr/share/icons/hicolor/48x48/apps/phantomops.png
  - src: icons/64x64.png
    dst: /usr/share/icons/hicolor/64x64/apps/phantomops.png
  - src: icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/phantomops.png
  - src: icons/256x256.png
    dst: /usr/share/icons/hicolor/256x256/apps/phantomops.png
  - src: icons/512x512.png
    dst: /usr/share/icons/hicolor/512x512/apps/phantomops.png

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
