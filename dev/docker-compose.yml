# Development playground: services that misbehave on purpose so the
# collectors have something real to detect.
#   docker compose -f dev/docker-compose.yml up -d
services:
  leaky-api:
    image: python:3.12-alpine
    container_name: phantom-leaky-api
    mem_limit: 64m
    memswap_limit: 64m
    restart: on-failure:3
    command:
      - python
      - -u
      - -c
      - |
        import time
        hog = []
        while True:
            hog.append(bytearray(4 * 1024 * 1024))
            print("ERROR: database connection pool exhausted, retrying", flush=True)
            time.sleep(1)
