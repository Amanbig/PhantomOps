title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What went wrong or took too long?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like PhantomOps to do?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Collectors / new integration, Root cause analysis, Rollbacks, Notifications, Dashboards, Reports, Other]
  - type: markdown
    attributes:
      value: "Ideas are not promises. For a defect, please [open an issue](https://github.com/Amanbig/PhantomOps/issues/new/choose) instead."
