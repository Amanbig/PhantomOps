name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (collectors & core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Wails GUI package needs GTK/WebKit, so CI checks the pure-Go
      # packages only (internal/ and cmd/).
      - name: gofmt
        run: |
          out="$(gofmt -l internal cmd)"
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./internal/... ./cmd/...
      - name: build
        run: go build ./internal/... ./cmd/...
      - name: test
        run: go test ./internal/... ./cmd/...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
