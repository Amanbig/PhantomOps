name: Release

# Builds and publishes. Checks run on pull requests (checks.yml), so the code
# being tagged has already been verified; this workflow does not repeat them.
#   1. ./scripts/release.sh v0.2.0 in a PR (bumps the version, archives the notes)
#   2. merge it, then: git tag v0.2.0 && git push origin v0.2.0
# workflow_dispatch builds the packages without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: phantomops-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            output_name: phantomops-windows-amd64
          - os: macos-latest
            platform: darwin/universal
            output_name: phantomops-darwin-universal

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Not a check: it decides the version baked into the binary. A tag that
      # disagrees with wails.json would ship binaries that report the wrong
      # version (and the in-app updater would offer the same release forever).
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="$GITHUB_REF_NAME"
            want="v$(jq -r '.info.productVersion' wails.json)"
            if [ "$v" != "$want" ]; then
              echo "Tag $v does not match wails.json ($want). Run scripts/release.sh $v in a PR first."; exit 1
            fi
          else
            v="dev"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building PhantomOps $v"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        uses: nsis-dev/setup-nsis@v1

      - name: Install Wails and packaging tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          if [ "${{ runner.os }}" = "Linux" ]; then
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.0  # newest nfpm that builds with Go 1.25 (go.mod)
          fi

      - name: Build
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          LDFLAGS="-X 'PhantomOps/internal/version.Version=${APP_VERSION}'"
          if [ "${{ runner.os }}" = "Linux" ]; then
            wails build -tags webkit2_41 -platform ${{ matrix.platform }} -ldflags "$LDFLAGS"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            for p in "/c/Program Files/NSIS" "/c/Program Files (x86)/NSIS" "/c/ProgramData/chocolatey/bin"; do
              if [ -d "$p" ]; then export PATH="$p:$PATH"; fi
            done
            wails build -nsis -platform ${{ matrix.platform }} -ldflags "$LDFLAGS"
          else
            wails build -platform ${{ matrix.platform }} -ldflags "$LDFLAGS"
          fi
          ls -la build/bin

      - name: Package Linux (.tar.gz, .deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          tar -czvf phantomops-linux-amd64.tar.gz -C build/bin PhantomOps
          VERSION_CLEAN="${APP_VERSION#v}"
          if [ "$VERSION_CLEAN" = "dev" ]; then VERSION_CLEAN="0.0.0"; fi
          cd build/linux
          VERSION="$VERSION_CLEAN" nfpm package --config nfpm.yaml --packager deb --target ../../phantomops-linux-amd64.deb
          VERSION="$VERSION_CLEAN" nfpm package --config nfpm.yaml --packager rpm --target ../../phantomops-linux-amd64.rpm

      - name: Package Windows (.zip, installer .exe)
        if: runner.os == 'Windows'
        run: |
          (cd build/bin && 7z a ../../phantomops-windows-amd64.zip PhantomOps.exe)
          installer="$(find build/bin -type f -iname '*installer*.exe' | head -n 1)"
          if [ -z "$installer" ]; then echo "NSIS installer was not produced" >&2; exit 1; fi
          cp "$installer" phantomops-windows-amd64-installer.exe

      - name: Package macOS (.zip, .dmg)
        if: runner.os == 'macOS'
        run: |
          (cd build/bin && zip -r ../../phantomops-darwin-universal.zip PhantomOps.app)
          brew install create-dmg || true
          create-dmg --volname "PhantomOps" --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --icon "PhantomOps.app" 175 160 --hide-extension "PhantomOps.app" --app-drop-link 425 160 \
            phantomops-darwin-universal.dmg build/bin/PhantomOps.app \
          || hdiutil create -volname "PhantomOps" -srcfolder build/bin/PhantomOps.app -ov -format UDZO phantomops-darwin-universal.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: phantomops-*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # The in-app updater refuses to install anything not listed here.
      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum phantomops-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
